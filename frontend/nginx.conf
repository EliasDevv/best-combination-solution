server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The all-games response is ~1.3 MiB of JSON; compressing it matters more
    # than anything else this server does.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Uncompressed /api/compare payloads reach ~1.3 MiB.
    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's collected static files, shared from the backend container via a
    # named volume (DEBUG=False means Django will not serve them itself).
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
    }

    # Angular routes are resolved client-side: anything that is not a real
    # file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
