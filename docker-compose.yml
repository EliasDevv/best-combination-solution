# `docker compose up` starts the whole application on http://localhost:8080.
# `docker compose up db redis` starts only the databases, for running the
# backend and the Angular dev server natively (see README, "Local development").

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-best_combination}
      POSTGRES_USER: ${POSTGRES_USER:-best_combination}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-best_combination}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-best_combination}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      # The container runs the production settings on purpose: it exercises the
      # Redis cache backend and the strict security defaults, not just the
      # permissive dev module.
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # Demo key for local review. A real deployment supplies its own.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-only-key-not-for-deployment}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # nginx in front of this speaks plain HTTP; without this, prod's
      # SECURE_SSL_REDIRECT would bounce every request to an https:// URL
      # that nothing is listening on.
      DJANGO_SSL_REDIRECT: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-best_combination}
      POSTGRES_USER: ${POSTGRES_USER:-best_combination}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-best_combination}
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Read-only mount: put the three challenge CSVs in data/ before the first
      # `up` and the entrypoint imports them instead of generating synthetic
      # data. The directory is gitignored, so a fresh clone is empty.
      - ./data:/app/data:ro
      - staticfiles:/app/backend/staticfiles
    ports:
      # Not needed by the UI (nginx proxies /api), but handy for curl.
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    volumes:
      - staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - backend

volumes:
  pgdata:
  staticfiles:
